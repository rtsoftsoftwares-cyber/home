    if(document.hidden){
      // before leaving: persist immediately
      try{
        const m = sessionStorage.getItem('outlog_matricula') || localStorage.getItem('outlog_matricula') || '';
        const lp = '';
        if(m && lp) serverSaveLastOpenedPageFallback(lp,m);
        persistImmediateSnapshot();
      }catch(e){}
      stopKeepers();
    } else {
      // restore attempt when returning
      attemptAutoRestore();
      startKeepers();
    }
  }, { passive:true });

  window.addEventListener('focus', function(){ attemptAutoRestore(); }, { passive:true });

  // beforeunload: attempt final persist/save
  window.addEventListener('beforeunload', function(){
    try{
      const m = sessionStorage.getItem('outlog_matricula') || localStorage.getItem('outlog_matricula') || '';
      const lp = '';
      if(m && lp) serverSaveLastOpenedPageFallback(lp,m);
      persistImmediateSnapshot();
    }catch(e){}
  });

  // persist immediate snapshot (used on hidden/unload)
  function persistImmediateSnapshot(){
    try{
      const matricula = sessionStorage.getItem('outlog_matricula') || localStorage.getItem('outlog_matricula') || getCookie('outlog_matricula') || '';
      const nome = sessionStorage.getItem('operadorNome') || localStorage.getItem('operadorNome') || getCookie('operadorNome') || '';
      const acesso = (()=>{ try{ return JSON.parse(sessionStorage.getItem('acesso')||'[]'); }catch(e){ return []; } })();
      if(matricula) persistSessionRobust({ matricula, nome, acessos: acesso, keepLogged: true });
    }catch(e){ console.warn('persistImmediateSnapshot fail', e); }
  }

  // serverSaveLastOpenedPage fallback wrapper (best-effort)
  function serverSaveLastOpenedPageFallback(pageName,matricula){
    try{
      if(window.google && google && google.script && google.script.run){
        if(typeof google.script.run.saveLastOpenedPage === 'function') { google.script.run.saveLastOpenedPage(pageName,matricula); return; }
        if(typeof google.script.run.saveFavoritePage === 'function') { google.script.run.saveLastOpenedPage(pageName, matricula); return; }
        if(typeof google.script.run.registrarUltimaPagina === 'function') { google.script.run.saveLastOpenedPage((pageName,matricula)); return; }
      }
    }catch(e){}
    // else do a beacon fallback if possible
    try{
      if(navigator.sendBeacon){
        const url = '/saveLastPageBeacon';
        navigator.sendBeacon(url, new Blob([JSON.stringify({ matricula, pageName })], { type:'application/json' }));
      }
    }catch(e){}
  }

  /* ---------- expose small API to original app ---------- */
  window.__SESSION_GUARD__ = {
    persistNow: persistImmediateSnapshot,
    startKeepers: startKeepers,
    stopKeepers: stopKeepers,
    attemptAutoRestore: attemptAutoRestore,
    persistSessionRobust: persistSessionRobust
  };

  // start keepers on load for working sessions
  try { // call after short timeout so original salvarSessao can run first if present
    setTimeout(()=> {
      // if there is any session info available, initialize keepers and try restore
      const anyMat = sessionStorage.getItem('outlog_matricula') || localStorage.getItem('outlog_matricula') || getCookie('outlog_matricula') || '';
      if(anyMat){
        startKeepers();
        attemptAutoRestore();
      } else {
        // try to restore from IDB/cookies/local
        attemptAutoRestore();
      }
    }, 120);
  } catch(e){}

  // safe guard: every 5 minutes ensure snapshot persisted
  setInterval(()=>{ try{ persistImmediateSnapshot(); }catch(e){} }, 5*60*1000);

})();



  (function() {
  // Configuração: Altere aqui para os testes (ex: 5000 para 5 segundos)
  // Para produção, use: 3 * 60 * 60 * 1000 (3 horas)
  var INTERVALO_VERIFICACAO = 5 * 1000; 

  function iniciarRotinaMonitoramento() {
    // 1. Tenta pegar a matrícula de TODOS os locais possíveis (Redundância para Tablet)
    const matricula = sessionStorage.getItem("outlog_matricula") ||  "";

    // Se o sistema ainda está carregando a tela e não achou a matrícula, reagenda a busca
    if (!matricula) {
      setTimeout(iniciarRotinaMonitoramento, 3000);
      return;
    }

    // Executa a primeira checagem imediatamente
    executarChecagemStatus(matricula);

    // Agenda as próximas repetições
    setInterval(function() {
      executarChecagemStatus(matricula);
    }, INTERVALO_VERIFICACAO);
  }

  function executarChecagemStatus(matricula) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(status) {
          // Garante a leitura do número vindo da planilha
          if (Number(status) === 0) {
            aplicarOverlayBloqueio(matricula);
          }
        })
        .withFailureHandler(function(erro) {
          console.error("Erro na verificação do tablet:", erro);
        })
        .verificarStatusNoAcess(matricula);
    } else {
      console.warn("Ambiente Google não detectado na WebView atual.");
    }
  }

  function aplicarOverlayBloqueio(matricula) {
    if (document.getElementById("bloqueio-atualizacao-global")) return;

    // Força a remoção do scroll da página de fundo no tablet
    try {
      document.body.style.overflow = "hidden";
    } catch(e){}

    var estilo = document.createElement("style");
    estilo.innerHTML = "" +
      "#bloqueio-atualizacao-global {" +
        "position: fixed !important;" +
        "top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;" +
        "width: 100% !important; height: 100% !important;" +
        "background: #0f111a !important;" + // Sem transparência para garantir bloqueio visual total
        "z-index: 2147483647 !important;" + // Maior z-index permitido no ecossistema web
        "display: flex !important;" +
        "align-items: center !important;" +
        "justify-content: center !important;" +
        "padding: 20px !important;" +
        "box-sizing: border-box !important;" +
      "}" +
      ".card-bloqueio-alerta {" +
        "background: #1a1d2e !important;" +
        "border: 1px solid rgba(255, 255, 255, 0.1) !important;" +
        "border-top: 4px solid #ff9100 !important;" +
        "max-width: 450px !important;" +
        "width: 100% !important;" +
        "padding: 35px 25px !important;" +
        "border-radius: 12px !important;" +
        "text-align: center !important;" +
        "box-shadow: 0 20px 50px rgba(0,0,0,0.8) !important;" +
        "font-family: sans-serif !important;" +
      "}" +
      ".card-bloqueio-alerta h2 {" +
        "color: #f8fafc !important;" +
        "font-size: 22px !important;" +
        "margin: 15px 0 12px 0 !important;" +
        "font-weight: 700 !important;" +
      "}" +
      ".card-bloqueio-alerta p {" +
        "color: #94a3b8 !important;" +
        "font-size: 15px !important;" +
        "line-height: 1.6 !important;" +
        "margin-bottom: 30px !important;" +
      "}" +
      ".btn-bloqueio-forcado {" +
        "width: 100% !important;" +
        "background: #ff9100 !important;" +
        "border: none !important;" +
        "color: #000000 !important;" +
        "padding: 16px !important;" +
        "border-radius: 8px !important;" +
        "font-size: 16px !important;" +
        "font-weight: 700 !important;" +
        "cursor: pointer !important;" +
      "}";
    document.head.appendChild(estilo);

    var overlay = document.createElement("div");
    overlay.id = "bloqueio-atualizacao-global";
    overlay.innerHTML = "" +
      "<div class='card-bloqueio-alerta'>" +
        "<div style='font-size: 50px; color: #ff9100;'><i class='fa-solid fa-triangle-exclamation'></i></div>" +
        "<h2>Reinicialização Necessária</h2>" +
        "<p>O OutLog precisa ser reiniciado. Para garantir a sincronização das tarefas, este dispositivo foi bloqueado.</p>" +
        "<button id='btn-executar-atualizacao-obrigatoria' class='btn-bloqueio-forcado'>" +
          "Deslogar e Atualizar Agora" +
        "</button>" +
      "</div>";
    
    document.body.appendChild(overlay);

    document.getElementById("btn-executar-atualizacao-obrigatoria").onclick = function() {
      this.disabled = true;
      this.innerHTML = "REINICIE O APLICATIVO...";

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(deslogarSessaoTerminal)
          .withFailureHandler(function() {
            deslogarSessaoTerminal();
          })
          .saveLastOpenedPage("updateConcluido.html", matricula);
      } else {
        logout();
      }
    };
  }

  function deslogarSessaoTerminal() {
    if (typeof window.logout === 'function') {
      window.logout();
      boxLoginHide.style.display="flex";
    } else if (typeof logout === 'function') {
      logout();
      boxLoginHide.style.display="flex";
    } else {
      try {
        localStorage.clear();
        sessionStorage.clear();
        location.reload();
      } catch (e) {
        alert("Sessão encerrada. Por favor, reabra o aplicativo.");
      }
    }
  }

  // Inicialização forçada independente do evento do navegador
  if (document.readyState === "complete" || document.readyState === "interactive") {
    iniciarRotinaMonitoramento();
  } else {
    document.addEventListener("DOMContentLoaded", iniciarRotinaMonitoramento);
  }
})();
</script>
